[build]
command = "./netlify_build.sh"
publish = "public"

[context.deploy-preview.environment]
HUGO_VERSION = "0.117.0"
NODE_VERSION = "24"

[context.production.environment]
HUGO_ENV = "production"
HUGO_VERSION = "0.117.0"
NODE_VERSION = "24"

[dev]
framework = "hugo"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[functions.call-build-hook]
schedule = "5 9 * * *"

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self' abapinho.com *.abapinho.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/@algolia/autocomplete-theme-classic; form-action 'self'; script-src 'self' 'unsafe-inline' abapinho.com *.abapinho.com https://cdn.jsdelivr.net/algoliasearch/3/algoliasearch.min.js https://cdn.jsdelivr.net/autocomplete.js/0/autocomplete.min.js algolianet.com *.algolianet.com; connect-src 'self' abapinho.com *.abapinho.com algolianet.com *.algolianet.com *.algolia.net; img-src 'self'; base-uri 'self';"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "0"

[[plugins]]
package = "@netlify/plugin-sitemap"

[[plugins]]
package = "netlify-plugin-submit-sitemap"
pinned_version = "0.4.0"

[[plugins]]
package = "netlify-plugin-checklinks"

[plugins.inputs]
# Advisory only — this plugin reports broken links but does not fail
# the build (unlike running `hyperlink` directly, which we tried and
# which broke a production deploy on false positives). It does add
# ~1m45s per build across ~600 pages; there's no clean way to gate a
# declarative plugin to production-only via netlify.toml, so this cost
# is paid on every build (previews included).
skipPatterns = [
  # Third-party sites whose redirect status code (301 vs 302) the
  # checker flags as a mismatch — the destination resolves fine, only
  # the intermediate redirect type differs from what's cached.
  "git-scm.com",
  "abapzombie.com",
  "andymatuschak.org",
  "sapyard.com",
  "wiki.sdn.sap.com"
]

[[plugins]]
package = "netlify-plugin-hugo-cache-resources"

[plugins.inputs]
debug = false

[[plugins]]
package = "@netlify/plugin-lighthouse"
pinned_version = "6.0.1"

[plugins.inputs]
output_path = "reports/lighthouse.html"

[[redirects]]
force = false
from = "/*"
status = 302
to = "/en/:splat"

[redirects.conditions]
Language = ["en"]

[redirects.query]
path = ":path"
